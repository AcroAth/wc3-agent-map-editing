[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wc3-tester"
version = "0.1.0"
description = "MCP server for automated Warcraft III map testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AcroAth" }]
keywords = ["warcraft-3", "wc3", "mcp", "testing", "automation"]
dependencies = [
    "mcp>=1.2,<2",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dump = ["minidump>=0.0.23"]
wgc = ["windows-capture>=1.2"]

[project.scripts]
wc3-tester = "wc3_tester.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


